name: Release

on:
  push:
    tags:
      - 'v*'  # Запускается только на теги вида v1.0.0, v2.1.3 и т.д.

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false